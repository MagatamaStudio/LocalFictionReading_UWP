name: Build (UWP)

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: MSBuild x64 (Debug)
    # UWP 工程用的是旧式 csproj + Microsoft.Windows.UI.Xaml.CSharp.targets，
    # 需要 Windows SDK 10.0.19041 + UWP 工作负载。
    # GitHub 的 windows-2022 镜像自带 19041 SDK，但**默认不装 UWP 工作负载**，
    # 所以下面先用 Chocolatey 补装（约 15~20 秒）。
    # 注意：不要改成 windows-latest，新镜像不再带 19041 SDK。
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install UWP workload (Universal Windows Platform build tools)
        shell: pwsh
        run: |
          choco install visualstudio2022-workload-universal -y --no-progress --package-parameters "--includeRecommended"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installPath) { throw "Visual Studio installation not found" }
          Write-Host "VS install path: $installPath"

          $xamlRoot = Join-Path $installPath 'MSBuild\Microsoft\WindowsXaml'
          $found = Get-ChildItem $xamlRoot -Recurse -Filter 'Microsoft.Windows.UI.Xaml.CSharp.targets' -ErrorAction SilentlyContinue
          if (-not $found) { throw "UWP XAML targets still missing under $xamlRoot" }
          Write-Host "UWP XAML targets found:"
          $found | ForEach-Object { Write-Host "  $($_.FullName)" }

      - name: Restore NuGet packages
        run: |
          nuget restore LocalFictionReader.sln
          msbuild LocalFictionReader.sln -t:restore -p:Configuration=Debug -p:Platform=x64

      - name: Build (x64 Debug, unsigned)
        run: >
          msbuild LocalFictionReader\LocalFictionReader.csproj
          -p:Configuration=Debug
          -p:Platform=x64
          -p:AppxPackageSigningEnabled=false
          -p:AppxBundle=Never
          -p:UapAppxPackageBuildMode=SideloadOnly
          -p:UseSharedCompilation=false
          -verbosity:minimal

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: LocalFictionReader-x64
          path: |
            LocalFictionReader/AppPackages/**
            LocalFictionReader/bin/x64/Debug/**
          if-no-files-found: warn

  # 打 tag（v*）时自动创建 GitHub Release：
  # 附件 = 未签名的 .msix + 含依赖/安装脚本的 AppPackages 压缩包（本机需开发者模式安装）
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: LocalFictionReader-x64
          path: dist

      - name: Collect msix and dependency bundle
        run: |
          set -euo pipefail
          MSIX=$(find dist -name '*.msix' -print -quit)
          if [ -z "$MSIX" ]; then echo "::error::no .msix produced"; exit 1; fi
          echo "msix: $MSIX"
          mkdir -p out
          cp "$MSIX" out/
          if [ -d dist/AppPackages ]; then
            (cd dist && zip -qr ../out/LocalFictionReader-AppPackages.zip AppPackages)
          fi
          ls -la out

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            out/*
